"어두움" = []
"웅장" = []
"신남" = []
"here_we_go" = ["HERE WE GO! — Lil Nas X"]   # 로마노 'Here we go' 확정 이적 릴스 1순위(2024 · 베벌리힐스 캅 주제가)

[[feeds]]                       # 2026-11-28 해외축구 전문 매체(국내) RSS — 반자동 후보 보고의 소스

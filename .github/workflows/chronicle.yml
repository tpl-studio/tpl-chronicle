name: chronicle
# 축구 왕국 연대기 — Cloudflare 감시(tpl-live-watch)가 새 후보를 보면 부름(workflow_dispatch). 예약(cron) 없음.
# 공개 저장소라 Actions 시간은 무료. 상태는 chronicle-state 브랜치(state/)에 이어서 저장.
on:
  schedule:
    - cron: "*/5 * * * *"      # 2026-11-26: 5분마다 개인 봇 확인(직접 요청 기사) — 새 메시지 없으면 몇 초 만에 끝(공개 저장소 · 무료)
  workflow_dispatch:
    inputs:
      trigger:
        description: "부른 곳(watch · tick · manual)"
        required: false
        default: "manual"
      mode:
        description: "run · dry(판정만) · force(시간 규칙 무시하고 판정) · inbox(개인 봇 직접 요청만)"
        required: false
        default: "run"

permissions:
  contents: write

jobs:
  # 1) 봇 확인 — 줄(concurrency) 밖에서 몇 초: 예약·감시기 inbox 호출은 새 메시지·대기 요청이 있을 때만 2)로 넘어감
  #    (확인만 하는 실행이 줄에 서서 대기 중인 로마노 HWG 실행을 밀어내지 않게 · 2026-11-26)
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.p.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          PERSONAL_BOT_TOKEN: ${{ secrets.PERSONAL_BOT_TOKEN }}
          PERSONAL_CHAT_ID: ${{ secrets.PERSONAL_CHAT_ID }}
          TPL_CHRONICLE_STATE: /tmp/chronicle.json
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.trigger }}" = "inbox" ]; then
            git fetch -q origin chronicle-state 2>/dev/null && git show origin/chronicle-state:chronicle.json > /tmp/chronicle.json 2>/dev/null || true
            python3 tools/inbox_peek.py
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: peek
    if: needs.peek.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: chronicle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 상태 브랜치 받기(state/)
        run: |
          git config user.name "tpl-chronicle-bot"
          git config user.email "tpl-chronicle-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin chronicle-state >/dev/null 2>&1; then
            git fetch -q origin chronicle-state
            git worktree add -q state origin/chronicle-state
          else
            mkdir -p state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 배경 분리 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpl_reel
          key: isnet-v1

      - name: 연대기 그림 보관(다시 글 만들 때 재사용 · 2026-11-28)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpl_chronicle_art
          key: chronicle-art-${{ github.run_id }}
          restore-keys: chronicle-art-

      - name: 설치
        run: pip install -q -r requirements.txt

      - name: 판단·제작
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}          # 글·판정(무료). 없으면 Claude Haiku 로 대신
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PERSONAL_BOT_TOKEN: ${{ secrets.PERSONAL_BOT_TOKEN }}
          PERSONAL_CHAT_ID: ${{ secrets.PERSONAL_CHAT_ID }}
          PERSONAL_BOT_NAME: ${{ secrets.PERSONAL_BOT_NAME }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TPL_CHRONICLE_STATE: ${{ github.workspace }}/state/chronicle.json
          TPL_REEL_LEDGER: ${{ github.workspace }}/state/ledger.json
          TPL_REEL_MODEL_DIR: /home/runner/.cache/tpl_reel
          TPL_CHRONICLE_ART_KEEP: /home/runner/.cache/tpl_chronicle_art
          TZ: Asia/Seoul
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          [ "${{ github.event_name }}" = "schedule" ] && MODE="inbox"
          ARGS=""
          [ "$MODE" = "inbox" ] && ARGS="--inbox"
          [ "$MODE" = "dry" ] && ARGS="--dry"
          [ "$MODE" = "force" ] && ARGS="--force"
          python chronicle_run.py $ARGS

      - name: 상태 올리기(chronicle-state)
        if: always()
        run: |
          cd state
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -q -b chronicle-state
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git add -A
          git -c user.name="tpl-chronicle-bot" -c user.email="tpl-chronicle-bot@users.noreply.github.com" commit -q -m "state $(date +%m-%d_%H:%M)" || exit 0
          git push -q origin HEAD:chronicle-state

      - name: 인스타 버튼 누름 저장 실패 알림(2026-11-28)
        if: failure()
        env:
          PERSONAL_BOT_TOKEN: ${{ secrets.PERSONAL_BOT_TOKEN }}
          PERSONAL_CHAT_ID: ${{ secrets.PERSONAL_CHAT_ID }}
        run: |
          [ -f /tmp/ig_tap_new ] || exit 0
          curl -s -o /dev/null --form-string "chat_id=$PERSONAL_CHAT_ID"             --form-string "text=⚠️ 인스타 버튼 누름 못 받음(저장 실패) — 다시 눌러주세요"             "https://api.telegram.org/bot$PERSONAL_BOT_TOKEN/sendMessage" || true
